# Nginx del frontend: archivos estáticos de Vite + proxy de la API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Importación masiva: hasta 50 MB por petición en el backend (IMPORT_MAX_TOTAL_MB) + margen.
    client_max_body_size 60m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── API: se reenvía al contenedor del backend (misma origen → sin CORS) ──
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # El backend usa `trust proxy 1`: toma la IP real del cliente de aquí
        # (límite de intentos de login y de /imports por IP).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una importación grande puede tardar en clasificarse.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Recursos con hash de Vite: caché larga ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché: tras una actualización el navegador toma los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── React Router: cualquier ruta del cliente (/estudiantes/:carnet, …) → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
